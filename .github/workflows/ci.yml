name: Build and Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start local server and run isolated tests
        run: |
          npm run dev -- --port 5173 --strictPort > /tmp/tavern-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          # run every suite, and put the reason for a failure in the run's annotations
          status=0
          for suite in smoke test:scene test:persistence test:architecture test:platform test:bilibili; do
            echo "::group::$suite"
            if ! npm run "$suite" > "/tmp/suite.log" 2>&1; then
              status=1
              echo "::error title=$suite failed::$(tail -c 2500 /tmp/suite.log | tr '\n\r' '  ')"
            fi
            cat /tmp/suite.log
            echo "::endgroup::"
          done
          exit $status
      - run: npm run test:production
